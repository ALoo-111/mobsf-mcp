services:
  - type: web
    name: mobsf-mcp
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: MCP_TRANSPORT=streamable-http MCP_HOST=0.0.0.0 MCP_PORT=10000 mobsf-mcp
    envVars:
      - key: MOBSF_URL
        value: https://mobsf.live
      - key: MOBSF_API_KEY
        sync: false
      - key: MOBSF_TIMEOUT
        value: "300"
      - key: MOBSF_VERIFY_TLS
        value: "true"
      - key: HTTP_CLIENT_BACKEND
        value: requests
      - key: HTTP_CLIENT_HTTP2
        value: "false"
      - key: ENABLE_DYNAMIC_ANALYSIS
        value: "false"
      - key: MAX_APK_SIZE_MB
        value: "500"
